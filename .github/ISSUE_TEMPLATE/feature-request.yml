name: Feature Request
description: Suggest an improvement to PEPPER OS
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What memory problem or friction does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / experience
      description: Describe how the feature should behave in PEPPER OS
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: How to verify
    validations:
      required: true
