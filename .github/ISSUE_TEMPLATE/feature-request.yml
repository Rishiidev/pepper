name: Feature Request
description: Suggest an improvement for PEPPER
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or improvement
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: How to verify
    validations:
      required: true
