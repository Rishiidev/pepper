<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="640" fill="#050507"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#181822" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="640" fill="#FF3B30"/>

  <!-- Category Eyebrow -->
  <text x="60" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="20"
        font-weight="700" fill="#FF3B30" letter-spacing="4">OPERATING SYSTEM FOR HUMAN MEMORY</text>

  <!-- Project Name -->
  <text x="60" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="76"
        font-weight="800" fill="#ffffff" letter-spacing="-1">PEPPER OS</text>

  <!-- Tagline -->
  <text x="60" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="26"
        fill="#9E9EAF">Leave any workspace instantly. Return as if you never left.</text>

  <!-- 4 Feature Boxes -->
  <rect x="60" y="300" width="270" height="42" rx="8" fill="#0D0D12" stroke="#181822" stroke-width="1"/>
  <rect x="60" y="300" width="4" height="42" rx="2" fill="#FF3B30"/>
  <text x="76" y="326" font-family="'JetBrains Mono', monospace" font-size="14"
        font-weight="600" fill="#F4F4F6">▶ Silent Auto-Capture</text>

  <rect x="350" y="300" width="270" height="42" rx="8" fill="#0D0D12" stroke="#181822" stroke-width="1"/>
  <rect x="350" y="300" width="4" height="42" rx="2" fill="#3fb950"/>
  <text x="366" y="326" font-family="'JetBrains Mono', monospace" font-size="14"
        font-weight="600" fill="#3fb950">▶ Memory Recall (⌘K)</text>

  <rect x="640" y="300" width="270" height="42" rx="8" fill="#0D0D12" stroke="#181822" stroke-width="1"/>
  <rect x="640" y="300" width="4" height="42" rx="2" fill="#58a6ff"/>
  <text x="656" y="326" font-family="'JetBrains Mono', monospace" font-size="14"
        font-weight="600" fill="#58a6ff">▶ Reconstruct Context</text>

  <rect x="930" y="300" width="270" height="42" rx="8" fill="#0D0D12" stroke="#181822" stroke-width="1"/>
  <rect x="930" y="300" width="4" height="42" rx="2" fill="#d2a8ff"/>
  <text x="946" y="326" font-family="'JetBrains Mono', monospace" font-size="14"
        font-weight="600" fill="#d2a8ff">▶ BYOK 8-Provider AI</text>

  <!-- Install / Clone Block -->
  <rect x="60" y="393" width="1020" height="64" rx="10" fill="#0D0D12" stroke="#181822" stroke-width="1"/>
  <rect x="60" y="393" width="4" height="64" rx="2" fill="#FF3B30"/>
  <text x="86" y="432" font-family="'JetBrains Mono', monospace" font-size="22"
        fill="#FF3B30">$</text>
  <text x="114" y="432" font-family="'JetBrains Mono', monospace" font-size="22"
        fill="#F4F4F6">git clone https://github.com/Rishiidev/pepper.git</text>

  <!-- Feature Pills -->
  <rect x="60" y="488" width="160" height="34" rx="17" fill="#0D0D12" stroke="#181822"/>
  <text x="140" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13"
        font-weight="600" fill="#9E9EAF" text-anchor="middle">Open Source</text>

  <rect x="234" y="488" width="160" height="34" rx="17" fill="#0D0D12" stroke="#181822"/>
  <text x="314" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13"
        font-weight="600" fill="#9E9EAF" text-anchor="middle">MIT License</text>

  <rect x="408" y="488" width="160" height="34" rx="17" fill="#0D0D12" stroke="#181822"/>
  <text x="488" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13"
        font-weight="600" fill="#9E9EAF" text-anchor="middle">Local First</text>

  <rect x="582" y="488" width="160" height="34" rx="17" fill="#0D0D12" stroke="#181822"/>
  <text x="662" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13"
        font-weight="600" fill="#9E9EAF" text-anchor="middle">Zero Tracking</text>

  <rect x="756" y="488" width="160" height="34" rx="17" fill="#0D0D12" stroke="#181822"/>
  <text x="836" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13"
        font-weight="600" fill="#9E9EAF" text-anchor="middle">Manifest V3</text>

  <text x="1220" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="19"
        fill="#5F5F70" text-anchor="end">github.com/Rishiidev/pepper</text>
</svg>
